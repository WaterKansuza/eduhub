        }

        .ground:before {
            right: 50%;
            margin-right: -166.6666666667px;
            box-shadow: 265px -335px 15px #a1aec6, 645px -555px 15px #bac4d5, 890px -910px 15px #8798b6, 1180px -1220px 15px #a7b4c9, 1525px -1475px 15px #94a3be, 1845px -1755px 15px #97a6c0, 2110px -2090px 15px #b4bed1, 2375px -2425px 15px #b7c1d3, 2685px -2715px 15px #7e90b0, 2995px -3005px 15px #a4b1c8, 3330px -3270px 15px #a1aec6, 3610px -3590px 15px #9aa9c2, 3910px -3890px 15px #8798b6, 4210px -4190px 15px #a1aec6, 4530px -4470px 15px #8e9eba, 4805px -4795px 15px #b4bed1;

        .mound {

        .mound:before {

            border-radius: 4px 4px 20px 20px;

    <div class="content">

    <script>
        (function () {
            function ready(fn) {
                if (document.readyState != 'loading') {
                    fn();
                } else {
                    document.addEventListener('DOMContentLoaded', fn);
                }
            }

            function makeSnow(el) {
                var ctx = el.getContext('2d');
                var width = 0;
                var height = 0;
                var particles = [];

                var Particle = function () {
                    this.x = this.y = this.dx = this.dy = 0;
                    this.reset();
                }

                Particle.prototype.reset = function () {
                    this.y = Math.random() * height;
                    this.x = Math.random() * width;
                    this.dx = (Math.random() * 1) - 0.5;
                    this.dy = (Math.random() * 0.5) + 0.5;
                }

                function createParticles(count) {
                    if (count != particles.length) {
                        particles = [];
                        for (var i = 0; i < count; i++) {
                            particles.push(new Particle());
                        }
                    }
                }

                function onResize() {
                    width = window.innerWidth;
                    height = window.innerHeight;
                    el.width = width;
                    el.height = height;

                    createParticles((width * height) / 10000);
                }

                function updateParticles() {
                    ctx.clearRect(0, 0, width, height);
                    ctx.fillStyle = '#f6f9fa';

                    particles.forEach(function (particle) {
                        particle.y += particle.dy;
                        particle.x += particle.dx;

                        if (particle.y > height) {
                            particle.y = 0;
                        }

                        if (particle.x > width) {
                            particle.reset();
                            particle.y = 0;
                        }

                        ctx.beginPath();
                        ctx.arc(particle.x, particle.y, 5, 0, Math.PI * 2, false);
                        ctx.fill();
                    });

                    window.requestAnimationFrame(updateParticles);
                }

                onResize();
                updateParticles();

                window.addEventListener('resize', onResize);
            }

            ready(function () {
                var canvas = document.getElementById('snow');
                makeSnow(canvas);
            });
        })();
    </script>
